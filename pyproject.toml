[project]
name = "abduls-pi"
version = "0.1.0"
description = "abdul's Pi: Gemini coding agent with tools and approval gates"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-google-genai>=4.4",
    "langchain-mcp-adapters>=0.3",
    "langgraph>=1.2",
    "python-dotenv>=1.2",
    "langgraph-cli[inmem]"
]

[project.scripts]
abduls-pi = "abduls_pi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abduls_pi"]
