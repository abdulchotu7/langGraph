[project]
name = "weather-agent"
version = "0.1.0"
description = "Learning LangGraph: Gemini agent with a weather tool"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-google-genai>=4.4",
    "langgraph>=1.2",
    "python-dotenv>=1.2",
]

[project.scripts]
weather-agent = "weather_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weather_agent"]
